<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Skills Utilization Platform</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/auth.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="auth-body">

  <div class="auth-card">
    <div class="auth-header">
      <div class="brand-logo">Skills Utilization Platform</div>
      <h2>Welcome Back</h2>
      <p>Log in to access your personalized course recommendations</p>
    </div>

    <form id="loginForm" class="auth-form">
      <div id="authAlert" class="auth-alert hidden"></div>

      <div class="form-group">
        <label for="username">Username or Email</label>
        <div class="input-icon-wrapper">
          <i class="fa-solid fa-user"></i>
          <input type="text" id="username" placeholder="Enter your username" required>
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-icon-wrapper">
          <i class="fa-solid fa-lock"></i>
          <input type="password" id="password" placeholder="Enter your password" required>
        </div>
      </div>

      <button type="submit" class="auth-submit-btn">
        <span>Log In</span>
        <i class="fa-solid fa-arrow-right"></i>
      </button>

      <div class="auth-footer">
        <p>Don't have an account? <a href="register.html">Register here</a></p>
      </div>
    </form>
  </div>

  <script src="/js/auth.js"></script>
</body>
</html>
