<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Profile & Skills - Platform</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/profile.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <!-- Decorative Shapes -->
  <div class="geo-shape shape-orange"></div>
  <div class="geo-shape shape-yellow"></div>
  <div class="geo-shape shape-green"></div>

  <div class="app-canvas">
    <div class="main-frame">

      <!-- Top Header Navigation -->
      <header class="top-nav">
        <div class="nav-left">
          <a href="/courses.html" class="brand-logo" style="text-decoration:none; color:white;">Skills Utilization Platform</a>
        </div>

        <button class="mobile-menu-toggle" id="mobileMenuToggle" aria-label="Toggle Navigation">
          <i class="fa-solid fa-bars"></i>
        </button>

        <div class="nav-right" id="navRight">
          <div class="notification-badge" title="Notifications">
            <i class="fa-regular fa-bell"></i>
            <span class="badge-count">12</span>
          </div>
          <!-- Direct Profile Page Link -->
          <a href="/profile.html" class="user-profile-pill active-pill">
            <span id="navUsername">Account</span>
            <div class="avatar-sm" id="navAvatar">U</div>
          </a>
        </div>
      </header>

      <!-- Profile Header Hero -->
      <section class="dashboard-hero">
        <div class="hero-user-info">
          <div class="avatar-container">
            <div class="avatar-lg" id="profileAvatar">
              <i class="fa-solid fa-user"></i>
            </div>
          </div>
          <div class="user-greeting">
            <span class="greeting-subtitle">User Profile</span>
            <h2 id="profileFullName">Loading Profile...</h2>
            <p id="profileEmail" class="profile-email-sub"></p>
          </div>
        </div>
      </section>

      <!-- Main White Content Card -->
      <main class="content-card">

        <!-- Navigation Sub-Tabs -->
        <nav class="sub-tabs">
          <a href="/courses.html" class="tab-item"><i class="fa-solid fa-graduation-cap"></i> COURSE CATALOG</a>
          <a href="/recommendations.html" class="tab-item"><i class="fa-solid fa-chart-line"></i> RECOMMENDATIONS</a>
          <a href="/skills.html" class="tab-item"><i class="fa-solid fa-trophy"></i> MY SKILLS</a>
        </nav>

        <!-- User Information Details -->
        <section class="profile-info-section">
          <h3 class="section-heading"><i class="fa-solid fa-id-card"></i> Personal Information</h3>
          <div class="info-grid">
            <div class="info-box">
              <span class="info-label">Full Name</span>
              <span class="info-value" id="infoName">-</span>
            </div>
            <div class="info-box">
              <span class="info-label">Username</span>
              <span class="info-value" id="infoUsername">-</span>
            </div>
            <div class="info-box">
              <span class="info-label">Email Address</span>
              <span class="info-value" id="infoEmail">-</span>
            </div>
            <div class="info-box">
              <span class="info-label">Account Status</span>
              <span class="info-value status-active" id="infoStatus">Active</span>
            </div>
          </div>
        </section>

        <hr class="divider">

        <!-- Membership Management -->
        <section class="profile-info-section">
          <h3 class="section-heading"><i class="fa-solid fa-gem"></i> Membership</h3>
          <div class="info-grid">
            <div class="info-box">
              <span class="info-label">Membership Status</span>
              <span class="info-value status-active" id="membershipStatus">Loading...</span>
            </div>
            <div class="info-box">
              <span class="info-label">Expires On</span>
              <span class="info-value" id="membershipExpiry">-</span>
            </div>
            <div class="info-box">
              <span class="info-label">Actions</span>
              <div style="display:flex; gap:8px; margin-top:4px;">
                <button id="renewMembershipBtn" class="membership-btn renew-btn" type="button">Renew Membership</button>
                <button id="cancelMembershipBtn" class="membership-btn cancel-btn" type="button">Cancel</button>
              </div>
            </div>
          </div>
          <p class="block-desc" id="membershipMessage" style="margin-top:12px; margin-bottom:0;"></p>
        </section>

        <hr class="divider">

        <!-- Change Password -->
        <section class="profile-info-section">
          <h3 class="section-heading"><i class="fa-solid fa-key"></i> Change Password</h3>
          <form id="changePasswordForm" class="change-password-form">
            <div class="password-form-row">
              <label for="currentPassword">Current Password</label>
              <input type="password" id="currentPassword" autocomplete="current-password">
            </div>
            <div class="password-form-row">
              <label for="newPassword">New Password</label>
              <input type="password" id="newPassword" autocomplete="new-password">
            </div>
            <div class="password-form-row">
              <label for="confirmNewPassword">Confirm New Password</label>
              <input type="password" id="confirmNewPassword" autocomplete="new-password">
            </div>
            <button type="submit" class="membership-btn renew-btn" style="align-self:flex-start;">Update Password</button>
            <p class="block-desc" id="changePasswordMessage" style="margin-top:10px; margin-bottom:0;"></p>
          </form>
        </section>

      </main>
    </div>
  </div>

  <script src="/js/profile.js"></script>
</body>
</html>
